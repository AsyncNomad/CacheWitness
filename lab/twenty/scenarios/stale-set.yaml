# Stale-set race on Twenty's workspace cache, forced in the same order every
# run (the flow of the phase-1 sync experiment, docs/design/phase1-results.md
# 5.8). Run with lab/twenty/verify.sh, which starts two servers with the
# cawit-hook enabled and the fix chosen by FIX.
name: twenty-stale-set
runs: 20
apps:
  a: http://127.0.0.1:3000
  b: http://127.0.0.1:3001
redis: redis://127.0.0.1:6379
postgres: "host=127.0.0.1 user=postgres password=postgres dbname=test"

requests:
  rename:
    path: /metadata
    headers: { authorization: "Bearer ${env.CAWIT_TOKEN}" }
    json:
      query: "mutation($n: String!) { updateWorkspace(data: { displayName: $n }) { id } }"
      variables: { n: "${value}" }
    error_field: errors
  read:
    path: /metadata
    headers: { authorization: "Bearer ${env.CAWIT_TOKEN}" }
    json: { query: "{ currentWorkspace { id } }" }
    error_field: errors

state:
  cache_key: "integration-tests:engine:core-entity:workspace:20202020-1c25-4d02-bf25-6aeccf7ea419:data"
  cache_field: displayName
  db_query: "select \"displayName\" from core.workspace where id = '20202020-1c25-4d02-bf25-6aeccf7ea419'"

steps:
  # 1. write through A: commits, invalidates, clears A's memoizer
  - http: { app: a, request: rename, vars: { value: "${run}-a" } }
  - sleep: { ms: 50 }
  # 2. read through A: it misses, reads the database, and is held at the hook
  - arm: { point: "refill:after-read", key: "workspaceEntity:20202020-1c25-4d02-bf25-6aeccf7ea419", as: refill }
  - http: { app: a, request: read, async: held_read }
  - reached: { sync: refill, timeout_ms: 10000 }
  # 3. write a newer value through B: commits and invalidates
  - http: { app: b, request: rename, vars: { value: "${run}-b" } }
  # 4. release A, which writes what it read
  - release: { sync: refill }
  - await: { task: held_read }
  - sleep: { ms: 100 }
  # 5. the cache must not hold the old value
  - expect: { name: not_stale, check: cache_not_stale }
  # 6. a fix must not stop caching: one more read refills with the current value
  - http: { app: a, request: read }
  - sleep: { ms: 100 }
  - expect: { name: refilled, check: cache_equals_db }
