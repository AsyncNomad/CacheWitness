[workspace]
resolver = "3"
members = ["crates/cawit", "crates/cawit-verify", "crates/cawit-resp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/AsyncNomad/CacheWitness"
homepage = "https://github.com/AsyncNomad/CacheWitness"
rust-version = "1.85"
keywords = ["cache", "redis", "postgres", "testing", "race-condition"]
categories = ["development-tools::testing", "caching", "database"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-postgres = "0.7"
